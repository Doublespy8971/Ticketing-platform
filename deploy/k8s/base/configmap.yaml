apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-config
  namespace: ticketing
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.ticketing.svc.cluster.local:9092"
  REDIS_HOST: "redis.ticketing.svc.cluster.local"
  REDIS_PORT: "6379"
  OUTBOX_ENABLED: "true"
  OUTBOX_POLL_INTERVAL_MS: "200"
  OUTBOX_BATCH_SIZE: "100"
  JAVA_OPTS_EXTRA: ""
  TICKETING_CONSUMER_SESSION_TIMEOUT_MS: "15000"
  TICKETING_CONSUMER_HEARTBEAT_INTERVAL_MS: "3000"
  KAFKA_SESSION_TIMEOUT_MS: "15000"
  KAFKA_HEARTBEAT_INTERVAL_MS: "3000"
  KAFKA_TOPIC: "order.events"
  KAFKA_GROUP_ID: "notification-service-order-cg"
  MOCK_PAYMENT_FAILURE_RATE: "0"
  INVENTORY_SERVICE_URL: "http://inventory-service.ticketing.svc.cluster.local:8081"
  ORDER_SERVICE_URL: "http://order-service.ticketing.svc.cluster.local:8082"
  PAYMENT_SERVICE_URL: "http://payment-service.ticketing.svc.cluster.local:8083"
