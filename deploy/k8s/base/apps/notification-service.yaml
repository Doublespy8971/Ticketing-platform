apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticketing
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: ticketing-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticketing
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: ticketing-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: ticketing-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8084"
    spec:
      serviceAccountName: notification-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              wait_tcp() {
                host="$1"; port="$2"; label="$3"; deadline=$(( $(date +%s) + 180 ))
                echo "[init] Waiting up to 180s for ${label} (${host}:${port})..."
                while ! nc -z -w 2 "$host" "$port" >/dev/null 2>&1; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "[init] ERROR: Timed out after 180s waiting for missing dependency: ${label} (${host}:${port})" >&2
                    exit 1
                  fi
                  sleep 2
                done
                echo "[init] Dependency ready: ${label}"
              }
              wait_tcp redis.ticketing.svc.cluster.local 6379 redis
              wait_tcp kafka.ticketing.svc.cluster.local 9092 kafka
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        - name: wait-for-order-topic
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              deadline=$((SECONDS + 180))
              echo "[init] Waiting up to 180s for Kafka topic 'order.events' (provisioned by kafka-init)..."
              while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.ticketing.svc.cluster.local:9092 --describe --topic order.events >/dev/null 2>&1; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "[init] ERROR: Timed out after 180s waiting for missing dependency: Kafka topic 'order.events'" >&2
                  exit 1
                fi
                sleep 3
              done
              echo "[init] Dependency ready: Kafka topic 'order.events'"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-logs
              mountPath: /opt/kafka/logs
      containers:
        - name: notification-service
          image: ticketing/notification-service:dev
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: KAFKA_TOPIC
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: KAFKA_GROUP_ID
            - name: KAFKA_SESSION_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: KAFKA_SESSION_TIMEOUT_MS
            - name: KAFKA_HEARTBEAT_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: KAFKA_HEARTBEAT_INTERVAL_MS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
