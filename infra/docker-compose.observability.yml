networks:
  ticketing-net:
    name: ticketing-net

volumes:
  prometheus-data:
  grafana-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    networks: [ticketing-net]
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    networks: [ticketing-net]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    networks: [ticketing-net]
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9308/metrics"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    container_name: redis-exporter
    networks: [ticketing-net]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9121/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres-inventory-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-inventory-exporter
    networks: [ticketing-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-ticketing}:${POSTGRES_PASSWORD:-ticketing_secret}@postgres-inventory:5432/inventory_db?sslmode=disable"
    depends_on:
      postgres-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9187/metrics"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres-order-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-order-exporter
    networks: [ticketing-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-ticketing}:${POSTGRES_PASSWORD:-ticketing_secret}@postgres-order:5432/order_db?sslmode=disable"
    depends_on:
      postgres-order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9187/metrics"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres-payment-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-payment-exporter
    networks: [ticketing-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-ticketing}:${POSTGRES_PASSWORD:-ticketing_secret}@postgres-payment:5432/payment_db?sslmode=disable"
    depends_on:
      postgres-payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9187/metrics"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
