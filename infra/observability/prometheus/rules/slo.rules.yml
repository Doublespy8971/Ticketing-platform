            sum by (le) (rate(http_server_requests_seconds_bucket{service="order-service",uri="/api/v1/orders/{orderId}/checkout",method="POST",status="202"}[6h]))
          )

      # -----------------------------------------------------------------------
      # 6. Order Materialization Lag: target p95 <= 350ms, p99 <= 800ms
      # -----------------------------------------------------------------------
      - record: sli:order_materialization_lag_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ticketing_orders_materialization_lag_seconds_bucket{service="order-service"}[5m]))
          )

      - record: sli:order_materialization_lag_seconds:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(ticketing_orders_materialization_lag_seconds_bucket{service="order-service"}[5m]))
          )

      - record: sli:order_materialization_lag_seconds:p99_30m
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(ticketing_orders_materialization_lag_seconds_bucket{service="order-service"}[30m]))
