global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo.rules.yml
  - /etc/prometheus/rules/alerts.rules.yml

scrape_configs:
  - job_name: gateway-service
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: inventory-service
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8081"]

  - job_name: order-service
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8082"]

  - job_name: payment-service
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]

  - job_name: notification-service
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8084"]

  - job_name: kafka-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis_exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres-inventory-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-inventory-exporter:9187"]

  - job_name: postgres-order-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-order-exporter:9187"]

  - job_name: postgres-payment-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-payment-exporter:9187"]
