server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 500ms
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
        pool:
          type: fixed
          max-connections: 200
          acquire-timeout: 2000
          max-idle-time: 30s
          max-life-time: 5m

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8081}

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8082}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

ticketing:
  gateway:
    allow-insecure-dev-secret: ${TICKETING_GATEWAY_ALLOW_INSECURE_DEV_SECRET:false}
    trusted-proxies: ${TICKETING_GATEWAY_TRUSTED_PROXIES:}
    dev-token:
      enabled: ${TICKETING_GATEWAY_DEV_TOKEN_ENABLED:false}
      allow-admin: ${TICKETING_GATEWAY_DEV_TOKEN_ALLOW_ADMIN:false}

management:
  metrics:
    tags:
      service: gateway-service
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
