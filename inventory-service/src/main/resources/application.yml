spring:
  application:
    name: inventory-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/inventory_db}
    username: ${POSTGRES_USER:ticketing}
    password: ${POSTGRES_PASSWORD:ticketing_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventory-service-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

server:
  port: ${SERVER_PORT:8081}

ticketing:
  consumer:
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    advisory-lock-id: 71001
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:200}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  sweeper:
    enabled: ${HOLD_EXPIRY_SWEEP_ENABLED:true}
    interval-ms: ${HOLD_EXPIRY_SWEEP_INTERVAL_MS:1000}
    batch-size: ${HOLD_EXPIRY_SWEEP_BATCH_SIZE:500}
    max-pages-per-tick: ${HOLD_EXPIRY_SWEEP_MAX_PAGES:20}
  redis:
    seat-hold-ttl-seconds: ${REDIS_SEAT_HOLD_TTL_SECONDS:660}
    event-drop-ts-ttl-seconds: 604800
    hold-ttl-safety-margin-seconds: 60
    rewarm-on-startup: ${REDIS_REWARM_ON_STARTUP:false}
    pipeline-batch-size: 500
    command-timeout: 500ms

management:
  metrics:
    tags:
      service: inventory-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
